name: Build xueersi-idf Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Merge into single .bin
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          esptool.py --chip esp32 merge_bin \
            -o build/xiaomiao-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x1000  build/bootloader/bootloader.bin \
            0x9000  build/partition_table/partition-table.bin \
            0x10000 build/xiaomiao.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-firmware
          path: build/xiaomiao-merged.bin
